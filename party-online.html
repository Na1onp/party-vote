<script>
// ========== API 配置 ==========
const API_BASE = 'https://party-vote-production.up.railway.app';

// ========== 状态 ==========
let currentUser = null;
let currentProject = null;
let tempAvatar = '😊';
let voteStep = 0;
let voteData = {};

// ========== 工具函数 ==========
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}
function hideAll() {
    ['loginPage','homePage','projectsPage','createProjectPage','joinProjectPage',
     'projectDetailPage','voteWizard','resultsPage','simpleModePage'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
    });
}
function uid() { return Math.random().toString(36).substring(2, 10); }

async function api(path, opts = {}) {
    const url = API_BASE + path;
    const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
}

// ========== 登录 ==========
const AVATARS = ['😊','🎉','🌟','🎈','🍀','🌸','🎨','🎮','🎵','🍕','🌮','🍜',
    '🎭','🎪','🎯','🎲','🎸','🎺','🎻','🎹','🎬','🎤','🎧','🎮',
    '🏀','⚽','🎾','🏐','🏓','🎳','⛳','🏹','🎣','🎿','🏂','⛷️',
    '🚴','🚵','🏇','🏊','🏄','🚣','⛵','🚤','🛳️','✈️','🚁','🚂'];

function renderAvatarGrid() {
    const grid = document.getElementById('avatarGrid');
    grid.innerHTML = '';
    AVATARS.forEach((a, i) => {
        const div = document.createElement('div');
        div.className = 'avatar-option' + (i === 0 ? ' selected' : '');
        div.textContent = a;
        div.onclick = () => {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected'); tempAvatar = a;
        };
        grid.appendChild(div);
    });
}

function renderHistoryUsers() {
    // online版暂不支持本地历史，因为数据都在后端
}

async function completeLogin() {
    const name = document.getElementById('loginName').value.trim();
    if (!name) { showToast('请输入名字'); return; }
    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '登录中<span class="loading"></span>';
    btn.disabled = true;
    try {
        const user = await api('/api/users', { method: 'POST', body: { name, avatar: tempAvatar, avatar_type: 'emoji' } });
        currentUser = user;
        localStorage.setItem('party_online_user', JSON.stringify(user));
        goHome();
    } catch (e) {

        btn.innerHTML = '🚀 开始'; btn.disabled = false;

async function showOnlineResults() {
    hideAll(); document.getElementById('resultsPage').classList.remove('hidden');
    const content = document.getElementById('resultsContent');
    content.innerHTML = '加载中...';
    try {
        const votes = await api(`/api/projects/${currentProject.code}/votes`);
        const stats = await api(`/api/projects/${currentProject.code}/stats`);
        renderResults(content, votes.votes || [], stats);
    } catch(e) {
        content.innerHTML = '<div style="color:#d9534f">加载失败：' + e.message + '</div>';
    }
}

function renderResults(container, votes, stats) {
    if (votes.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#888;padding:20px">还没有人投票</div>';
        return;
    }
    let html = '';

    // 统计摘要
    html += '<div style="margin-bottom:16px">';
    if (stats.best_date) html += `<div style="background:#e8f0fe;padding:10px 14px;border-radius:10px;margin-bottom:8px"><strong>📅 最佳日期：</strong>${stats.best_date}</div>`;
    if (stats.top_activity) html += `<div style="background:#fff8e1;padding:10px 14px;border-radius:10px;margin-bottom:8px"><strong>🎯 热门项目：</strong>${stats.top_activity}</div>`;
    html += '</div>';

    // 每个人的投票
    votes.forEach(v => {
        const activities = JSON.parse(v.activities_json || '[]').join('、') || '无';
        const dates = JSON.parse(v.dates_json || '[]').join('、') || '无';
        html += `
            <div class="vote-card">
                <div class="header">
                    <div class="avatar">${v.avatar || '😊'}</div>
                    <div class="name">${v.name}</div>
                </div>
                <div class="details">
                    <div>📅 ${dates}</div>
                    <div>🎯 ${activities}</div>
                    ${v.transport ? `<div>🚗 ${v.transport}</div>` : ''}
                    ${v.cuisine ? `<div>🍽️ ${v.cuisine}</div>` : ''}
                    ${v.restaurant ? `<div>🏪 ${v.restaurant}</div>` : ''}
                    ${v.people ? `<div>👥 ${v.people}</div>` : ''}
                    ${v.budget ? `<div>💰 ${v.budget}</div>` : ''}
                    ${v.note ? `<div>💬 ${v.note}</div>` : ''}
                </div>
                ${v.user_id === currentUser.id ? `
                    <div class="actions">
                        <button class="btn btn-secondary btn-small" onclick="editMyVote()">修改</button>
                        <button class="btn btn-danger btn-small" onclick="deleteMyVote()">删除</button>
                    </div>
                ` : ''}
            </div>
        `;
    });
    container.innerHTML = html;
}

    try {
        const result = await api('/api/random-itinerary', {
            method: 'POST',
            body: { budget: '中等', scenario: '动静结合', wake_time: '10:00', date: '' }
        });
        document.getElementById('simpleResult').innerHTML = `
            <div class="suggestion-card">
                <h4>💡 ${result.title || '给你个建议'}</h4>
                <p>${result.description || result.schedule?.map(s => s.time + '：' + s.activity).join('<br>') || '暂无建议'}</p>
            </div>
        `;
    } catch(e) {
        // 后端随机接口可能需要 date 参数，降级用本地
        const suggestions = [
            {title:'🍜 来碗面',desc:'找家附近的面馆，吃碗热乎乎的拉面或牛肉面，边吃边聊。人均20-40。'},
            {title:'☕ 咖啡馆坐坐',desc:'找家有氛围的咖啡馆，点杯喝的，聊聊天，发发呆。人均30-50。'},
            {title:'🎬 看场电影',desc:'看看最近有什么新片，买张票，放松两小时。人均40-60。'},
            {title:'🚶 公园散步',desc:'找个附近的公园，走走逛逛，呼吸新鲜空气，不花钱还健康。'},
            {title:'🎮 网吧开黑',desc:'找家电竞馆，开两台机子，打几局游戏，重温青春。人均20-40。'},
            {title:'🍢 路边烧烤',desc:'找个烧烤摊，点几串肉，喝瓶啤酒，聊人生聊理想。人均30-50。'},
        ];
        const s = suggestions[Math.floor(Math.random() * suggestions.length)];
        document.getElementById('simpleResult').innerHTML = `
            <div class="suggestion-card"><h4>${s.title}</h4><p>${s.desc}</p></div>
            <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="generateSimple()">🔄 再来一个</button>
        `;
    } finally {
        btn.innerHTML = '给我建议'; btn.disabled = false;
    }
}

// ========== 启动 ==========
initLogin();
</script>
